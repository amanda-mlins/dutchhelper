# ─────────────────────────────────────────────────────────────────────────────
# Deploy — Frontend → Netlify
#
# Triggered on push to main AFTER CI passes.
#
# Required GitHub secrets:
#   NETLIFY_AUTH_TOKEN  – personal access token from https://app.netlify.com/user/applications
#   NETLIFY_SITE_ID     – found in Site Settings → General → Site ID
#
# The site is https://unique-figolla-d56503.netlify.app/
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Frontend → Netlify

on:
  push:
    branches: [main]
    paths:
      # Only run when frontend code or Netlify config changes
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/deploy-frontend.yml"

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

# Prevent two frontend deploys from running simultaneously
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # ── Gate: CI must have passed first ───────────────────────────────────────
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Frontend — build check"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  # ── Build & Deploy ─────────────────────────────────────────────────────────
  deploy:
    name: Build & deploy to Netlify
    runs-on: ubuntu-latest
    needs: ci-gate
    environment:
      name: production-frontend
      url: https://unique-figolla-d56503.netlify.app/

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: frontend/dist
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
